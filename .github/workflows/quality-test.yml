name: YouTube Quality Test

on:
  workflow_run:
    workflows: ["YouTube to Google Drive"]
    types: [completed]
  workflow_dispatch:

jobs:
  quality-test:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install FFmpeg and curl
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install yt-dlp, EJS and PO Token provider
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade "yt-dlp[default]" yt-dlp-ejs bgutil-ytdlp-pot-provider

      - name: Install and start BgUtils
        run: |
          git clone --depth 1 --single-branch --branch 2.0.0 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git bgutil
          cd bgutil/server
          npm ci
          npx tsc
          nohup node build/main.js --port 4416 > ../../bgutil.log 2>&1 &
          cd ../..
          for i in {1..15}; do
            curl -fsS http://127.0.0.1:4416/ping && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:4416/ping

      - name: Create cookies
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          test -n "$YOUTUBE_COOKIES"
          printf '%s\n' "$YOUTUBE_COOKIES" > cookies.txt

      - name: Test first playlist video
        env:
          YOUTUBE_PLAYLIST_URL: ${{ secrets.YOUTUBE_PLAYLIST_URL }}
        run: |
          set -euo pipefail

          TEST_VIDEO_URL=$(yt-dlp \
            --flat-playlist \
            --playlist-end 1 \
            --print webpage_url \
            --cookies cookies.txt \
            --js-runtimes node \
            "$YOUTUBE_PLAYLIST_URL" | tail -n 1)

          test -n "$TEST_VIDEO_URL"
          echo "TEST VIDEO: $TEST_VIDEO_URL"

          mkdir -p quality-test

          yt-dlp \
            --verbose \
            --js-runtimes node \
            --cookies cookies.txt \
            --merge-output-format mkv \
            --download-sections "*0-30" \
            --format "bestvideo*+bestaudio/best" \
            --output "quality-test/%(title)s [quality-test].%(ext)s" \
            "$TEST_VIDEO_URL" 2>&1 | tee quality-test.log

          TEST_FILE=$(find quality-test -maxdepth 1 -type f | head -n 1)
          test -n "$TEST_FILE"

          echo "===== FINAL VIDEO STREAM ====="
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=codec_name,width,height,r_frame_rate,bit_rate \
            -of default=noprint_wrappers=1 "$TEST_FILE"

          HEIGHT=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$TEST_FILE")
          WIDTH=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$TEST_FILE")

          echo "FINAL RESOLUTION: ${WIDTH}x${HEIGHT}"

          if [ "${HEIGHT:-0}" -ge 2160 ]; then
            echo "RESULT: 4K/UHD OK"
          elif [ "${HEIGHT:-0}" -ge 1440 ]; then
            echo "RESULT: 1440p OK"
          elif [ "${HEIGHT:-0}" -ge 1080 ]; then
            echo "RESULT: 1080p OK"
          elif [ "${HEIGHT:-0}" -ge 720 ]; then
            echo "RESULT: 720p OK"
          else
            echo "RESULT: BELOW 720p - YouTube is still limiting the exposed format set"
          fi

      - name: Diagnostics
        if: always()
        run: |
          echo "===== yt-dlp provider evidence ====="
          grep -Ei "PO Token Providers|bgutil:http|JS runtimes|SABR|challenge solving|signature solving" quality-test.log 2>/dev/null || true
          echo "===== BgUtils log ====="
          cat bgutil.log 2>/dev/null || true
