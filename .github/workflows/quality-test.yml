name: YouTube Quality Test

on:
  workflow_run:
    workflows: ["YouTube to Google Drive"]
    types: [completed]
  workflow_dispatch:

jobs:
  quality-test:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install FFmpeg and curl
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r requirements.txt

      - name: Install and start BgUtils
        run: |
          git clone --depth 1 --single-branch --branch 2.0.0 \
            https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git bgutil
          cd bgutil/server
          npm ci
          npx tsc
          nohup node build/main.js --port 4416 > ../../bgutil.log 2>&1 &
          cd ../..

          for i in {1..15}; do
            if curl -fsS http://127.0.0.1:4416/ping; then
              echo
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:4416/ping
          echo

      - name: Create cookies
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          test -n "$YOUTUBE_COOKIES"
          printf '%s\n' "$YOUTUBE_COOKIES" > cookies.txt

      - name: Probe maximum quality of exact playlist video
        env:
          YOUTUBE_PLAYLIST_URL: ${{ secrets.YOUTUBE_PLAYLIST_URL }}
        run: |
          set -euo pipefail

          TEST_VIDEO_URL=$(yt-dlp \
            --flat-playlist \
            --playlist-end 1 \
            --print webpage_url \
            --cookies cookies.txt \
            --js-runtimes node \
            "$YOUTUBE_PLAYLIST_URL" | tail -n 1)

          test -n "$TEST_VIDEO_URL"
          echo "TARGET VIDEO: $TEST_VIDEO_URL"

          rm -rf probe-results quality-test
          mkdir -p probe-results

          CLIENTS="default web web_safari web_embedded web_music web_creator mweb ios visionos android android_vr tv tv_downgraded tv_simply"

          for CLIENT in $CLIENTS; do
            echo "============================================================"
            echo "PROBING CLIENT: $CLIENT"
            echo "============================================================"
            yt-dlp \
              --dump-single-json \
              --skip-download \
              --no-warnings \
              --js-runtimes node \
              --cookies cookies.txt \
              --extractor-args "youtube:player_client=$CLIENT" \
              "$TEST_VIDEO_URL" \
              > "probe-results/${CLIENT}.json" \
              2> "probe-results/${CLIENT}.err" || true
          done

          python - <<'PY'
          import glob
          import json
          import os

          def is_format(value):
              return isinstance(value, dict)

          def score(fmt):
              return (
                  int(fmt.get('height') or 0),
                  int(fmt.get('width') or 0),
                  float(fmt.get('fps') or 0),
                  float(fmt.get('tbr') or 0),
              )

          def label(fmt):
              if not fmt:
                  return 'NONE'
              width = int(fmt.get('width') or 0)
              height = int(fmt.get('height') or 0)
              return (
                  f"format={fmt.get('format_id')} "
                  f"resolution={fmt.get('resolution') or f'{width}x{height}'} "
                  f"fps={fmt.get('fps')} tbr={fmt.get('tbr')} "
                  f"url={'YES' if fmt.get('url') else 'NO'}"
              )

          global_metadata = None
          global_direct = None

          print('===== PER-CLIENT QUALITY REPORT =====')

          for path in sorted(glob.glob('probe-results/*.json')):
              client = os.path.basename(path)[:-5]
              try:
                  with open(path, encoding='utf-8') as fh:
                      info = json.load(fh)
              except Exception as exc:
                  print(f'CLIENT={client} STATUS=INVALID_JSON ERROR={exc}')
                  continue

              if not isinstance(info, dict):
                  print(f'CLIENT={client} STATUS=INVALID_INFO')
                  continue

              formats = [
                  item for item in (info.get('formats') or [])
                  if is_format(item)
                  and item.get('vcodec') not in (None, 'none')
                  and int(item.get('height') or 0) > 0
              ]

              metadata = max(formats, key=score) if formats else None
              direct = [item for item in formats if item.get('url')]
              downloadable = max(direct, key=score) if direct else None

              print(f'CLIENT={client} METADATA_MAX={label(metadata)}')
              print(f'CLIENT={client} DOWNLOADABLE_MAX={label(downloadable)}')

              if metadata and (global_metadata is None or score(metadata) > score(global_metadata[1])):
                  global_metadata = (client, metadata)

              if downloadable and (global_direct is None or score(downloadable) > score(global_direct[1])):
                  global_direct = (client, downloadable)

          print('===== GLOBAL MAXIMUM =====')
          print(
              'GLOBAL_METADATA_MAX=' +
              (label(global_metadata[1]) if global_metadata else 'NONE') +
              ' CLIENT=' +
              (global_metadata[0] if global_metadata else 'NONE')
          )
          print(
              'GLOBAL_DOWNLOADABLE_MAX=' +
              (label(global_direct[1]) if global_direct else 'NONE') +
              ' CLIENT=' +
              (global_direct[0] if global_direct else 'NONE')
          )

          with open('probe-selection.env', 'w', encoding='utf-8') as fh:
              fh.write(f"BEST_CLIENT={global_direct[0] if global_direct else ''}\n")
              fh.write(f"BEST_FORMAT_ID={global_direct[1].get('format_id') if global_direct else ''}\n")
              fh.write(f"BEST_HEIGHT={global_direct[1].get('height') if global_direct else '0'}\n")
              fh.write(f"BEST_WIDTH={global_direct[1].get('width') if global_direct else '0'}\n")
              fh.write(f"META_HEIGHT={global_metadata[1].get('height') if global_metadata else '0'}\n")

          if global_metadata and global_direct and score(global_metadata[1]) > score(global_direct[1]):
              print('DIAGNOSIS=SABR_OR_MISSING_DIRECT_URL')
          elif global_direct:
              print('DIAGNOSIS=DIRECT_DOWNLOAD_FORMAT_FOUND')
          else:
              print('DIAGNOSIS=NO_DIRECT_DOWNLOADABLE_VIDEO_FORMAT_FOUND')
          PY

          cat probe-selection.env

          BEST_CLIENT=$(grep '^BEST_CLIENT=' probe-selection.env | cut -d= -f2-)
          BEST_FORMAT_ID=$(grep '^BEST_FORMAT_ID=' probe-selection.env | cut -d= -f2-)

          if [ -n "$BEST_CLIENT" ] && [ -n "$BEST_FORMAT_ID" ]; then
            echo "===== VERIFYING ACTUAL DOWNLOAD ====="
            mkdir -p quality-test

            yt-dlp \
              --verbose \
              --js-runtimes node \
              --cookies cookies.txt \
              --extractor-args "youtube:player_client=$BEST_CLIENT" \
              --merge-output-format mkv \
              --download-sections "*0-30" \
              --format "$BEST_FORMAT_ID+bestaudio/best" \
              --output "quality-test/%(title)s [quality-test].%(ext)s" \
              "$TEST_VIDEO_URL" \
              2>&1 | tee quality-test.log

            TEST_FILE=$(find quality-test -maxdepth 1 -type f | head -n 1)
            test -n "$TEST_FILE"

            echo "===== FINAL REAL DOWNLOAD ====="
            ffprobe -v error -select_streams v:0 \
              -show_entries stream=codec_name,width,height,r_frame_rate,bit_rate \
              -of default=noprint_wrappers=1 "$TEST_FILE"
          else
            echo "NO DIRECT DOWNLOAD FORMAT WAS FOUND. The test will not pretend that 360p is the maximum."
          fi

      - name: Diagnostics
        if: always()
        run: |
          echo "===== Probe errors ====="
          for f in probe-results/*.err; do
            echo "--- $f ---"
            cat "$f" 2>/dev/null || true
          done
          echo "===== Quality log ====="
          tail -n 200 quality-test.log 2>/dev/null || true
          echo "===== BgUtils log ====="
          cat bgutil.log 2>/dev/null || true
