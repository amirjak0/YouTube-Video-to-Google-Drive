name: YouTube to Google Drive

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      update_existing:
        description: 'Auto-upgrade existing videos if higher resolution is found (e.g. 360p -> 1080p+)'
        required: false
        type: boolean
        default: true
      force_quality:
        description: 'Target maximum quality limit (2160, 1440, 1080, 720)'
        required: false
        default: '2160'

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install FFmpeg and curl
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl
          ffmpeg -version | head -n 1

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify YouTube runtime
        run: |
          node --version
          python -m pip --version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r requirements.txt
          yt-dlp --version
          python -c "import yt_dlp_ejs; print('yt-dlp-ejs: OK')"

      - name: Run downloader
        env:
          YOUTUBE_PLAYLIST_URL: ${{ secrets.YOUTUBE_PLAYLIST_URL }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          UPDATE_EXISTING: ${{ github.event.inputs.update_existing || 'true' }}
          FORCE_QUALITY_LIMIT: ${{ github.event.inputs.force_quality || '2160' }}
        run: |
          python main.py
