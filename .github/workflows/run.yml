name: YouTube to Google Drive

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install FFmpeg and curl
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl
          ffmpeg -version | head -n 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r requirements.txt

      - name: Show versions
        run: |
          echo "===== Python ====="
          python --version
          echo "===== Node ====="
          node --version
          echo "===== npm ====="
          npm --version
          echo "===== yt-dlp ====="
          yt-dlp --version
          echo "===== yt-dlp-ejs ====="
          python -c "import yt_dlp_ejs; print(getattr(yt_dlp_ejs, '__version__', 'installed'))"

      - name: Install BgUtils PO Token Provider
        run: |
          rm -rf bgutil-ytdlp-pot-provider
          git clone \
            --depth 1 \
            --single-branch \
            --branch 2.0.0 \
            https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git \
            bgutil-ytdlp-pot-provider
          cd bgutil-ytdlp-pot-provider/server
          npm ci
          npx tsc

      - name: Start PO Token server
        run: |
          cd bgutil-ytdlp-pot-provider/server
          nohup node build/main.js --port 4416 > ../../bgutil-provider.log 2>&1 &
          PROVIDER_PID=$!
          cd ../..

          READY=0
          for i in {1..15}; do
            if curl -fsS http://127.0.0.1:4416/ping > /tmp/provider_ping.txt 2>&1; then
              READY=1
              break
            fi
            sleep 2
            if ! kill -0 "$PROVIDER_PID" 2>/dev/null; then
              cat bgutil-provider.log || true
              exit 1
            fi
          done

          if [ "$READY" -ne 1 ]; then
            cat bgutil-provider.log || true
            exit 1
          fi

          curl -fsS http://127.0.0.1:4416/ping
          echo

      - name: Create Cookie File
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          test -n "$YOUTUBE_COOKIES"
          printf '%s\n' "$YOUTUBE_COOKIES" > cookies.txt
          wc -l cookies.txt

      - name: Verify YouTube access and PO Token
        run: |
          yt-dlp \
            --verbose \
            --simulate \
            --cookies cookies.txt \
            --js-runtimes node \
            "https://www.youtube.com/watch?v=dQw4w9WgXcQ" \
            2>&1 | tee yt-dlp-provider-test.log

          grep -qi "bgutil:http\|PO Token Providers" yt-dlp-provider-test.log || true

      - name: Run downloader
        env:
          YOUTUBE_PLAYLIST_URL: ${{ secrets.YOUTUBE_PLAYLIST_URL }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          python main.py

      - name: Show diagnostics
        if: always()
        run: |
          echo "===== BgUtils Provider Log ====="
          cat bgutil-provider.log 2>/dev/null || true
          echo "===== Workspace ====="
          find downloads -maxdepth 2 -type f -printf '%p\t%k KB\n' 2>/dev/null | sort || true
