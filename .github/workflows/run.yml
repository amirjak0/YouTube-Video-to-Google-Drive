name: YouTube to Google Drive

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:

  transfer:

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout code
        uses: actions/checkout@v4


      # ============================================================
      # FFmpeg
      # ============================================================

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg


      # ============================================================
      # Node.js
      # ============================================================

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'


      # ============================================================
      # Python
      # ============================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'


      # ============================================================
      # Install yt-dlp + Google libraries + PO Token provider
      # ============================================================

      - name: Install dependencies
        run: |

          python -m pip install --upgrade pip

          pip install --upgrade \
            "yt-dlp[default]" \
            google-api-python-client \
            google-auth-oauthlib \
            google-auth-httplib2 \
            bgutil-ytdlp-pot-provider


      # ============================================================
      # Install BgUtils PO Token server
      # ============================================================

      - name: Install BgUtils PO Token Provider
        run: |

          git clone \
            --depth 1 \
            --branch 1.3.1 \
            https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git \
            bgutil-ytdlp-pot-provider

          cd bgutil-ytdlp-pot-provider/server

          npm ci

          npx tsc


      # ============================================================
      # Start PO Token server
      # ============================================================

      - name: Start PO Token server
        run: |

          cd bgutil-ytdlp-pot-provider/server

          nohup node build/main.js \
            --host 127.0.0.1 \
            --port 4416 \
            > ../../bgutil-provider.log 2>&1 &

          sleep 5

          echo "===== BgUtils Provider Log ====="

          cat ../../bgutil-provider.log || true


      # ============================================================
      # Create cookie file
      # ============================================================

      - name: Create Cookie File
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}

        run: |

          printf '%s\n' "$YOUTUBE_COOKIES" > cookies.txt

          echo "Cookie file created."

          wc -l cookies.txt


      # ============================================================
      # Verify yt-dlp + PO Token provider
      # ============================================================

      - name: Verify yt-dlp
        run: |

          yt-dlp --version

          echo "===== yt-dlp plugin/providers ====="

          yt-dlp -v --simulate \
            --extractor-args "youtube:player_client=mweb" \
            "https://www.youtube.com/watch?v=dQw4w9WgXcQ" \
            2>&1 | grep -E \
            "PO Token Providers|bgutil|Plugin directories|mweb" \
            || true


      # ============================================================
      # Run downloader
      # ============================================================

      - name: Run script
        env:

          YOUTUBE_PLAYLIST_URL: ${{ secrets.YOUTUBE_PLAYLIST_URL }}

          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}

          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}

          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}

          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}

        run: |

          python main.py
