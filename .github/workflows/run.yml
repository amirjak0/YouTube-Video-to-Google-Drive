name: YouTube to Google Drive

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # Checkout
      # ============================================================
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # FFmpeg + curl
      # ============================================================
      - name: Install FFmpeg and curl
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl

          echo "===== FFmpeg ====="
          ffmpeg -version | head -n 1

      # ============================================================
      # Node.js
      # ============================================================
      # Current yt-dlp-ejs requires Node.js 22+
      # ============================================================
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ============================================================
      # Python
      # ============================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ============================================================
      # Install yt-dlp + Google libraries + PO Token provider
      # ============================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          pip install --upgrade \
            "yt-dlp[default]" \
            google-api-python-client \
            google-auth-oauthlib \
            google-auth-httplib2 \
            bgutil-ytdlp-pot-provider

      # ============================================================
      # Show installed versions
      # ============================================================
      - name: Show versions
        run: |
          echo "===== Python ====="
          python --version

          echo "===== Node ====="
          node --version

          echo "===== npm ====="
          npm --version

          echo "===== yt-dlp ====="
          yt-dlp --version

      # ============================================================
      # Install BgUtils PO Token server
      # ============================================================
      - name: Install BgUtils PO Token Provider
        run: |
          rm -rf bgutil-ytdlp-pot-provider

          git clone \
            --depth 1 \
            --single-branch \
            --branch 2.0.0 \
            https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git \
            bgutil-ytdlp-pot-provider

          cd bgutil-ytdlp-pot-provider/server

          echo "===== Installing BgUtils server dependencies ====="
          npm ci

          echo "===== Building BgUtils server ====="
          npx tsc

          echo "===== Build complete ====="
          ls -lah build

      # ============================================================
      # Start PO Token server and verify it is alive
      # ============================================================
      - name: Start PO Token server
        run: |
          cd bgutil-ytdlp-pot-provider/server

          echo "===== Starting BgUtils PO Token server ====="

          nohup node build/main.js \
            --port 4416 \
            > ../../bgutil-provider.log 2>&1 &

          PROVIDER_PID=$!
          echo "Provider PID: $PROVIDER_PID"

          cd ../..

          echo "===== Waiting for BgUtils server ====="

          READY=0

          for i in {1..15}; do
            if curl -fsS http://127.0.0.1:4416/ping > /tmp/provider_ping.txt 2>&1; then
              echo "BgUtils PO Token Provider is ONLINE."
              cat /tmp/provider_ping.txt
              READY=1
              break
            fi

            echo "Provider not ready yet... attempt $i/15"
            sleep 2

            if ! kill -0 "$PROVIDER_PID" 2>/dev/null; then
              echo "ERROR: BgUtils process stopped unexpectedly."
              echo "===== BgUtils Provider Log ====="
              cat bgutil-provider.log || true
              exit 1
            fi
          done

          if [ "$READY" -ne 1 ]; then
            echo "ERROR: BgUtils PO Token Provider is not reachable on port 4416."
            echo "===== BgUtils Provider Log ====="
            cat bgutil-provider.log || true
            exit 1
          fi

          echo "===== Final health check ====="
          curl -fsS http://127.0.0.1:4416/ping
          echo

      # ============================================================
      # Create cookie file
      # ============================================================
      - name: Create Cookie File
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -z "$YOUTUBE_COOKIES" ]; then
            echo "ERROR: YOUTUBE_COOKIES secret is empty."
            exit 1
          fi

          printf '%s\n' "$YOUTUBE_COOKIES" > cookies.txt

          echo "Cookie file created."
          echo "Cookie lines:"
          wc -l cookies.txt

      # ============================================================
      # Verify yt-dlp + PO Token provider
      # ============================================================
      - name: Verify yt-dlp and PO Token Provider
        run: |
          echo "===== yt-dlp version ====="
          yt-dlp --version

          echo "===== Node version ====="
          node --version

          echo "===== Provider health ====="
          curl -fsS http://127.0.0.1:4416/ping
          echo

          echo "===== yt-dlp automatic client verification ====="

          # Do not force mweb here. The downloader chooses the best client
          # automatically based on the formats actually exposed to this run.
          yt-dlp \
            --verbose \
            --simulate \
            --cookies cookies.txt \
            "https://www.youtube.com/watch?v=dQw4w9WgXcQ" \
            2>&1 | tee yt-dlp-provider-test.log

          echo "===== Provider evidence ====="

          if grep -qi "bgutil:http" yt-dlp-provider-test.log; then
            echo "BgUtils HTTP provider detected and available."
          else
            echo "WARNING: BgUtils HTTP provider was not reported in yt-dlp output."
          fi

          if grep -qi "PO Token Providers" yt-dlp-provider-test.log; then
            echo "PO Token provider system detected."
          else
            echo "WARNING: PO Token Providers line not found."
          fi

      # ============================================================
      # Run downloader
      # ============================================================
      - name: Run script
        env:
          YOUTUBE_PLAYLIST_URL: ${{ secrets.YOUTUBE_PLAYLIST_URL }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          echo "===== Starting main.py ====="
          python main.py

      # ============================================================
      # Diagnostics
      # ============================================================
      - name: Show diagnostics
        if: always()
        run: |
          echo "===== BgUtils Provider Log ====="
          cat bgutil-provider.log 2>/dev/null || true

          echo "===== Workspace files ====="
          find . -maxdepth 3 -type f \
            ! -path './.git/*' \
            -printf '%p\t%k KB\n' \
            | sort \
            | head -n 200
