name: YouTube to Google Drive

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      update_existing:
        description: 'Auto-upgrade existing videos if higher resolution is found (e.g. 360p -> 1080p+)'
        required: false
        type: boolean
        default: true
      force_quality:
        description: 'Target maximum quality limit (2160, 1440, 1080, 720)'
        required: false
        default: '2160'

permissions:
  contents: write
  actions: write

jobs:
  transfer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install FFmpeg and curl
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl
          ffmpeg -version | head -n 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r requirements.txt

      - name: Start PO Token Provider
        run: |
          docker run --name bgutil-provider -d --init \
            -p 127.0.0.1:4416:4416 \
            brainicism/bgutil-ytdlp-pot-provider:latest

          echo "Waiting for PO Token server to become ready..."
          for i in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:4416/ping >/dev/null 2>&1; then
              echo "PO Token server is ready."
              exit 0
            fi
            sleep 1
          done
          echo "::warning::PO Token server did not respond on port 4416; continuing anyway."

      - name: Run downloader
        env:
          YOUTUBE_PLAYLIST_URL: ${{ secrets.YOUTUBE_PLAYLIST_URL }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          UPDATE_EXISTING: ${{ github.event.inputs.update_existing || 'true' }}
          FORCE_QUALITY_LIMIT: ${{ github.event.inputs.force_quality || '2160' }}
          POT_SERVER_URL: http://127.0.0.1:4416
          MAX_WORKERS: '1'
          VIDEO_DELAY_SECONDS: '5'
          SLEEP_REQUESTS: '2'
          FORCE_IPV4: 'true'
        run: |
          python main.py

      - name: Stop PO Token Provider
        if: always()
        run: |
          docker rm -f bgutil-provider >/dev/null 2>&1 || true

      - name: Keep only the latest 5 workflow runs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          run_ids="$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/run.yml/runs?per_page=100" |
              jq -s -r '[.[].workflow_runs[]] | sort_by(.created_at) | reverse | .[5:] | .[].id'
          )"

          if [[ -z "$run_ids" ]]; then
            echo "No old workflow runs to delete."
            exit 0
          fi

          while IFS= read -r run_id; do
            [[ -z "$run_id" ]] && continue
            echo "Deleting old workflow run: $run_id"
            if gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$run_id"; then
              echo "Deleted workflow run: $run_id"
            else
              echo "::warning::Could not delete workflow run: $run_id"
            fi
          done <<< "$run_ids"
